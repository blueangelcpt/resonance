<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#181428" />
      <stop offset="60%" stop-color="#0a0c14" />
      <stop offset="100%" stop-color="#05060a" />
    </radialGradient>
    <radialGradient id="neonBloom" cx="50%" cy="48%" r="45%">
      <stop offset="0%" stop-color="#b026ff" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#00f0ff" stop-opacity="0.2" />
      <stop offset="85%" stop-color="#ff007f" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Vibrant Smooth Flowing Neon Gradient for R -->
    <linearGradient id="neonFlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="28%" stop-color="#00d4ff" />
      <stop offset="52%" stop-color="#8a2be2" />
      <stop offset="76%" stop-color="#b026ff" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>

    <!-- Subtle Inner Highlight/Specular on the R Fill -->
    <linearGradient id="rHighlight" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
    </linearGradient>

    <!-- Outer Squircle Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#b026ff" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#ff007f" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.2" />
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="neonAura" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="blurWide" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blurTight" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blurSharp" />
      <feMerge>
        <feMergeNode in="blurWide" />
        <feMergeNode in="blurTight" />
        <feMergeNode in="blurSharp" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Squircle Clip Path -->
    <clipPath id="squircleClip">
      <rect x="20" y="20" width="472" height="472" rx="108" ry="108" />
    </clipPath>

    <!-- Dot Grid Pattern -->
    <pattern id="telemetryGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#00f0ff" fill-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Base Icon Squircle Background -->
  <rect x="20" y="20" width="472" height="472" rx="108" ry="108" fill="url(#bgGlow)" />

  <!-- Inner Clipped Content -->
  <g clip-path="url(#squircleClip)">
    <!-- Sub-surface Telemetry Grid -->
    <rect x="20" y="20" width="472" height="472" fill="url(#telemetryGrid)" />

    <!-- Ambient Center Bloom Behind R -->
    <circle cx="256" cy="245" r="195" fill="url(#neonBloom)" />

    <!-- Cyber Circuit / EQ Accent Lines in Background -->
    <g opacity="0.3">
      <!-- Horizontal Telemetry Lines -->
      <line x1="40" y1="120" x2="160" y2="120" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="4 6" />
      <line x1="360" y1="120" x2="472" y2="120" stroke="#ff007f" stroke-width="1.5" stroke-dasharray="4 6" />
      <line x1="40" y1="390" x2="200" y2="390" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="2 5" />
      <line x1="320" y1="390" x2="472" y2="390" stroke="#b026ff" stroke-width="1.5" stroke-dasharray="3 6" />

      <!-- Corner Framing Marks -->
      <path d="M 60 90 L 60 60 L 90 60" fill="none" stroke="#00f0ff" stroke-width="2" />
      <path d="M 452 90 L 452 60 L 422 60" fill="none" stroke="#ff007f" stroke-width="2" />
      <path d="M 60 422 L 60 452 L 90 452" fill="none" stroke="#00f0ff" stroke-width="2" />
      <path d="M 452 422 L 452 452 L 422 452" fill="none" stroke="#ff007f" stroke-width="2" />

      <!-- Frequency Analyzer Micro Bars at Bottom -->
      <g transform="translate(106, 424)">
        <rect x="0" y="10" width="3" height="14" fill="#00f0ff" />
        <rect x="6" y="6" width="3" height="18" fill="#00f0ff" />
        <rect x="12" y="2" width="3" height="22" fill="#00f0ff" />
        <rect x="18" y="8" width="3" height="16" fill="#00f0ff" />
        <rect x="24" y="0" width="3" height="24" fill="#00f0ff" />
        <rect x="30" y="4" width="3" height="20" fill="#38bdf8" />
        <rect x="36" y="9" width="3" height="15" fill="#38bdf8" />
        <rect x="42" y="5" width="3" height="19" fill="#8a2be2" />
        <rect x="48" y="2" width="3" height="22" fill="#8a2be2" />
        <rect x="54" y="0" width="3" height="24" fill="#b026ff" />
        <rect x="60" y="7" width="3" height="17" fill="#b026ff" />
        <rect x="66" y="11" width="3" height="13" fill="#b026ff" />
        <rect x="72" y="3" width="3" height="21" fill="#ff007f" />
        <rect x="78" y="0" width="3" height="24" fill="#ff007f" />
        <rect x="84" y="6" width="3" height="18" fill="#ff007f" />
        <rect x="90" y="12" width="3" height="12" fill="#ff007f" />
      </g>
      <g transform="translate(306, 424)">
        <rect x="0" y="12" width="3" height="12" fill="#00f0ff" />
        <rect x="6" y="8" width="3" height="16" fill="#00f0ff" />
        <rect x="12" y="3" width="3" height="21" fill="#8a2be2" />
        <rect x="18" y="0" width="3" height="24" fill="#b026ff" />
        <rect x="24" y="7" width="3" height="17" fill="#b026ff" />
        <rect x="30" y="2" width="3" height="22" fill="#ff007f" />
        <rect x="36" y="5" width="3" height="19" fill="#ff007f" />
        <rect x="42" y="10" width="3" height="14" fill="#ff007f" />
        <rect x="48" y="6" width="3" height="18" fill="#ff007f" />
        <rect x="54" y="14" width="3" height="10" fill="#ff007f" />
      </g>
      <!-- Telemetry Text -->
      <text x="256" y="442" font-family="'Space Grotesk', 'Courier New', monospace" font-size="9" fill="#00f0ff" text-anchor="middle" letter-spacing="3" opacity="0.8">RESONANCE DSD 384K</text>
    </g>

    <!-- Diagonal Telemetry Wire Trace Behind R -->
    <line x1="80" y1="80" x2="432" y2="432" stroke="url(#neonFlowGrad)" stroke-width="1" opacity="0.25" />

    <!-- ============================================================ -->
    <!-- CLEAN, SOLID NEON GRADIENT CAPITAL 'R' (SMOOTH FLOWING FILL) -->
    <!-- ============================================================ -->
    <g filter="url(#neonAura)">
      <!-- Unified Clean Compound Path of Letter 'R' with Counter Cutout -->
      <path fill-rule="evenodd" clip-rule="evenodd"
        d="M 148 116
           C 148 110, 152 106, 158 106
           L 298 106
           C 368 106, 412 148, 412 208
           C 412 254, 378 288, 328 298
           L 414 398
           C 418 402, 418 406, 414 406
           L 348 406
           C 344 406, 340 403, 337 399
           L 258 298
           L 224 298
           L 224 398
           C 224 404, 220 406, 214 406
           L 158 406
           C 152 406, 148 404, 148 398
           Z
           M 224 172
           L 288 172
           C 318 172, 342 184, 342 208
           C 342 232, 318 244, 288 244
           L 224 244
           Z"
        fill="url(#neonFlowGrad)" />

      <!-- Subtle Specular Bevel / Top Light Layer -->
      <path fill-rule="evenodd" clip-rule="evenodd"
        d="M 148 116
           C 148 110, 152 106, 158 106
           L 298 106
           C 368 106, 412 148, 412 208
           C 412 254, 378 288, 328 298
           L 414 398
           C 418 402, 418 406, 414 406
           L 348 406
           C 344 406, 340 403, 337 399
           L 258 298
           L 224 298
           L 224 398
           C 224 404, 220 406, 214 406
           L 158 406
           C 152 406, 148 404, 148 398
           Z
           M 224 172
           L 288 172
           C 318 172, 342 184, 342 208
           C 342 232, 318 244, 288 244
           L 224 244
           Z"
        fill="url(#rHighlight)" />
    </g>

    <!-- Overlay Glass Sheen / Specular Horizon Arc -->
    <path d="M 20 180 C 120 100, 320 60, 492 120 L 492 20 L 20 20 Z" fill="#ffffff" opacity="0.035" />
  </g>

  <!-- Glowing Outer Chamfer Border -->
  <rect x="20" y="20" width="472" height="472" rx="108" ry="108" fill="none" stroke="url(#borderGrad)" stroke-width="3" />
  <rect x="23" y="23" width="466" height="466" rx="105" ry="105" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.25" />
</svg>
