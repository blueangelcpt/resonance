# REL-001: a version tag produces a draft release once every required job has
# passed. Public publication stays a deliberate act: the release is created as a
# draft, never published automatically.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
          - name: windows-x64
            runner: windows-2022
          - name: macos-arm64
            runner: macos-14
          - name: macos-x64
            runner: macos-13
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # Linux artifacts are built on the oldest supported baseline so the glibc
      # requirement is not raised accidentally (FRD section 16).
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config qt6-base-dev qt6-base-dev-tools \
            qt6-multimedia-dev libgl1-mesa-dev libtag1-dev libsqlite3-dev \
            libjpeg-dev libpng-dev zlib1g-dev libcurl4-openssl-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja taglib sqlite jpeg-turbo libpng curl qt@6

      - uses: jurplel/install-qt-action@v4
        if: runner.os == 'Windows'
        with:
          version: '6.10.2'
          modules: 'qtmultimedia'
          cache: true

      - uses: lukka/run-vcpkg@v11
        if: runner.os == 'Windows'
        with:
          vcpkgGitCommitId: '5b1214315250939257ef5d62ecdcbca18cf4fb1c'

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXTRA="-DCMAKE_TOOLCHAIN_FILE=${GITHUB_WORKSPACE}/vcpkg/scripts/buildsystems/vcpkg.cmake"
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            EXTRA="-DCMAKE_PREFIX_PATH=$(brew --prefix qt@6)"
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $EXTRA

      - name: Build
        run: cmake --build build --config Release

      # A build that passes its tests is the minimum bar for shipping. The FRD
      # is explicit that a successful build does not establish installer
      # compatibility or safe tagging.
      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Package
        run: cmake --build build --config Release --target package

      - name: Checksums and dependency notice
        shell: bash
        run: |
          cd build
          for f in *.exe *.dmg *.deb; do
            [ -e "$f" ] || continue
            if command -v sha256sum >/dev/null; then
              sha256sum "$f" >> SHA256SUMS.txt
            else
              shasum -a 256 "$f" >> SHA256SUMS.txt
            fi
          done
          cp ../native/DEPENDENCIES.md . 2>/dev/null || true
          cat SHA256SUMS.txt 2>/dev/null || echo "no artifacts produced"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            build/*.exe
            build/*.dmg
            build/*.deb
            build/SHA256SUMS.txt
            build/DEPENDENCIES.md
          if-no-files-found: warn

  draft:
    name: Draft release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Combine checksums
        run: |
          find artifacts -name SHA256SUMS.txt -exec cat {} + > SHA256SUMS.txt || true
          find artifacts -type f | sort

      # Signing status is stated rather than implied. An unsigned build is
      # never described as signed (FRD section 16).
      - name: Write the release notes
        run: |
          {
            echo "## Resonance ${GITHUB_REF_NAME}"
            echo
            echo "### Signing status"
            echo
            echo "- Windows: **unsigned**. No Authenticode certificate is configured."
            echo "- macOS: **unsigned and not notarised**. No Developer ID is configured."
            echo "- Linux: unsigned, as is normal for a .deb."
            echo
            echo "SmartScreen and Gatekeeper will warn. See docs/open-questions.md."
            echo
            echo "### Test status"
            echo
            echo "Every artifact here was built and its test suite passed on its own"
            echo "target OS. Installation, upgrade and uninstall lifecycle tests have"
            echo "**not** been run. See docs/traceability.md for what is verified and"
            echo "what is not."
            echo
            echo "### Checksums"
            echo
            echo '```'
            cat SHA256SUMS.txt 2>/dev/null || echo "none"
            echo '```'
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.deb
            SHA256SUMS.txt
