# Pull-request validation: build and test on every target, with no release
# credentials (FRD section 16).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            qt6-base-dev qt6-base-dev-tools qt6-multimedia-dev qt6-svg-dev \
            libgl1-mesa-dev libtag1-dev libsqlite3-dev libjpeg-dev \
            libpng-dev zlib1g-dev libcurl4-openssl-dev

      # The same presets a developer uses locally, so CI cannot drift from it.
      - name: Configure
        run: cmake --preset linux-strict

      - name: Build
        run: cmake --build --preset linux-strict

      - name: Test
        run: ctest --preset linux-strict

      # DIST-002: the application must work with no network. The suite already
      # runs offline; this asserts the CLI starts and reports honestly.
      - name: Offline smoke test
        run: |
          mkdir -p /tmp/smoke/source /tmp/smoke/data
          BIN=build/linux-strict/src/MusicLibrary.Cli/resonance
          "$BIN" --version
          "$BIN" scan --source /tmp/smoke/source --data /tmp/smoke/data --offline --quiet
          "$BIN" diagnostics --source /tmp/smoke/source --data /tmp/smoke/data --offline

      # UI-001: the desktop interface composes and paints. Offscreen, so no
      # display server is needed on the runner.
      - name: Desktop render smoke test
        run: |
          QT_QPA_PLATFORM=offscreen build/linux-strict/src/MusicLibrary.Desktop/resonance-desktop \
            --source /tmp/smoke/source --data /tmp/smoke/data --offline \
            --screenshot /tmp/smoke/window.png --size 1400x900
          test -s /tmp/smoke/window.png

      - name: Dependency inventory
        run: |
          echo "## CLI" && ldd build/linux-strict/src/MusicLibrary.Cli/resonance
          echo "## Desktop" && ldd build/linux-strict/src/MusicLibrary.Desktop/resonance-desktop

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-render
          path: /tmp/smoke/window.png
          if-no-files-found: warn

  sanitisers:
    name: ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config libtag1-dev libsqlite3-dev \
            libjpeg-dev libpng-dev zlib1g-dev libcurl4-openssl-dev

      # FRD section 15 requires ASan and UBSan on supported CI targets, and
      # fuzzing the tag reader with truncated and malformed inputs. The
      # randomised container pass in InfrastructureTests runs under both.
      - name: Configure
        run: cmake --preset linux-sanitisers

      - name: Build
        run: cmake --build --preset linux-sanitisers

      - name: Test under sanitisers
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --preset linux-sanitisers

  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          modules: 'qtmultimedia'
          cache: true

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'c76c06644034521fb761a39f8f52d8e87d1103d5'

      - name: Configure
        run: cmake --preset windows-release

      - name: Build
        run: cmake --build --preset windows-release

      - name: Test
        run: ctest --preset windows-release

      - name: Package
        run: cmake --build build/windows-release --config Release --target package

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: build/windows-release/*.exe
          if-no-files-found: warn

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            preset: macos-arm64
          - arch: x86_64
            runner: macos-13
            preset: macos-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ninja taglib sqlite jpeg-turbo libpng curl qt@6

      - name: Configure
        env:
          CMAKE_PREFIX_PATH: ${{ env.CMAKE_PREFIX_PATH }}
        run: |
          export CMAKE_PREFIX_PATH="$(brew --prefix qt@6):$(brew --prefix taglib)"
          cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Package
        run: cmake --build build/${{ matrix.preset }} --target package

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-dmg
          path: build/${{ matrix.preset }}/*.dmg
          if-no-files-found: warn
